name: Weekly Batch

on:
  schedule:
    - cron: '0 18 * * 0' # UTC 18:00 일요일 = KST 03:00 월요일
  workflow_dispatch: # 수동 실행 버튼

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: collect:users
        run: npm run collect:users
        env:
          GITHUB_TOKEN: ${{ secrets.BATCH_GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: collect:scores
        run: npm run collect:scores
        env:
          GITHUB_TOKEN: ${{ secrets.BATCH_GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: recalc:tiers
        run: npm run recalc:tiers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 완료 알림 이메일
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.naver.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[DevTier] 주간 배치 ${{ job.status == 'success' && '완료 ✅' || '실패 ❌' }}"
          to: std06158@naver.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            DevTier 주간 배치 실행 결과

            상태: ${{ job.status }}
            실행 시각: ${{ github.event.head_commit.timestamp || github.run_attempt }}
            실행 번호: #${{ github.run_number }}

            상세 로그:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
